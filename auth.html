<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no" />
  <script src="js/theme-init.js"></script>
  <script src="js/topbar-back.js" defer></script>
  <title>Sign In | Khmer Chess</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0d2d5c" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <script src="js/pwa.js" defer></script>
  <script type="module" src="js/notif-badge.js"></script>
  <script type="module">
    import { recordLoginToday } from './js/rewards.js';
    recordLoginToday();
  </script>

  <!-- Fill in a real Google OAuth Client ID here to enable "Sign in with
       Google" — see js/auth-page.js, which hides the button entirely when
       this is left blank. -->
  <meta name="google-signin-client-id" content="912690014991-26ig4eboam7kqh8spv5amh2k8aa7623n.apps.googleusercontent.com" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="js/auth-page.js"></script>

  <style>
    .auth-wrap{ max-width:420px; margin:2rem auto; padding:0 1rem; }
    .auth-card{ background:var(--panel); border-radius:1rem; box-shadow:var(--shadow); padding:1.3rem 1.2rem; }
    .auth-title{ font-weight:800; font-size:1.2rem; color:var(--blue); text-align:center; margin:0 0 .3rem; }
    .auth-sub{ text-align:center; opacity:.7; font-size:.85rem; margin:0 0 1rem; }
    .auth-error{ background:#fdeaea; color:#a3312f; border-radius:.6rem; padding:.6rem .7rem; font-size:.85rem; font-weight:700; }
    .auth-ok{ background:#e4f8ea; color:#1c7a3a; border-radius:.6rem; padding:.6rem .7rem; font-size:.85rem; font-weight:700; }
    .auth-loading{ background:#eef4ff; color:#2b4f9e; border-radius:.6rem; padding:.6rem .7rem; font-size:.85rem; font-weight:700; }
    .google-signin-wrap{ display:flex; justify-content:center; margin-bottom:.8rem; }

    /* Shown only for an installed home-screen app on iOS, in place of
       Google's own popup-based button (see js/auth-page.js) — styled to
       look like it, since it's the same "Continue with Google" action,
       just reached via a full-page redirect instead of a popup. */
    .google-fallback-btn{
      display:flex; align-items:center; justify-content:center; gap:.6rem;
      width:280px; max-width:100%; margin:0 auto .8rem; padding:.65rem 1rem;
      border:1px solid #dadce0; border-radius:.4rem; background:#fff;
      color:#3c4043; font-size:.95rem; font-weight:600; cursor:pointer;
    }
    .google-fallback-btn:active{ background:#f7f8f8; }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <button class="icon-btn topbar-back" type="button" aria-label="Back">‹</button>
      <h1>ចូល / ចុះឈ្មោះ (Account)</h1>
      <div class="spacer"></div>
    </header>

    <main class="page settings-page auth-wrap">
      <div class="auth-card">
        <h1 class="auth-title">អុកចត្រង្គ</h1>
        <p class="auth-sub">Continue with Google to sign in or create your account.</p>

        <div id="googleSignInSection" hidden>
          <div class="google-signin-wrap"><div id="googleSignInBtn"></div></div>
          <button type="button" id="googleSignInFallbackBtn" class="google-fallback-btn" hidden>
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
              <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
              <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
              <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.68 9c0-.593.102-1.17.284-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
              <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
            </svg>
            <span>Continue with Google</span>
          </button>
        </div>

        <div id="authMsg"></div>
      </div>
    </main>

    <footer id="appTabbar" class="home-nav">
      <a class="nav-item" href="index.html"><img class="ni-img" src="assets/ui/nav-home.png" alt=""><span data-i18n="nav.home">Home</span></a>
      <a class="nav-item" href="friends.html"><img class="ni-img" src="assets/ui/nav-friends.png" alt=""><span data-i18n="nav.friend">Friend</span></a>
      <a class="nav-item" href="play.html"><img class="ni-img" src="assets/ui/nav-play.png" alt=""><span data-i18n="nav.play">Play</span></a>
      <a class="nav-item" href="settings.html"><img class="ni-img" src="assets/ui/nav-settings.png" alt=""><span data-i18n="nav.setting">Setting</span></a>
      <a class="nav-item" href="notifications.html"><img class="ni-img" src="assets/ui/nav-bell.png" alt=""><span data-i18n="nav.notification">Notification</span></a>
    </footer>
    <div id="bottomSpacer" aria-hidden="true"></div>
  </div>

  <script>
    (function(){
      const bar = document.getElementById('appTabbar');
      const spacer = document.getElementById('bottomSpacer');
      if(!bar || !spacer) return;
      function setSpacer(){ spacer.style.height = bar.offsetHeight + 'px'; }
      if (document.readyState === 'complete') setSpacer(); else window.addEventListener('load', setSpacer);
      window.addEventListener('resize', setSpacer);
    })();
  </script>
</body>
</html>
