<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <script src="js/theme-init.js"></script>
  <script src="js/topbar-back.js" defer></script>
  <title>Notifications | Khmer Chess</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0d2d5c" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <script src="js/pwa.js" defer></script>
  <script type="module" src="js/notif-badge.js"></script>
  <script type="module">
    import { recordLoginToday } from './js/rewards.js';
    recordLoginToday();
  </script>

  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="js/notifications-page.js"></script>
  <style>
    .notif-list{ padding:.5rem 1rem 1rem; display:flex; flex-direction:column; gap:.5rem; }
    .notif-row-wrap{ position:relative; overflow:hidden; border-radius:.9rem; }
    .notif-row{
      display:flex; align-items:center; gap:.7rem; padding:.7rem .8rem;
      background:var(--panel); border-radius:.9rem; box-shadow:var(--shadow);
      border:1px solid rgba(13,45,92,.06); cursor:pointer;
      touch-action:pan-y; will-change:transform; position:relative;
    }
    .notif-row.unread{ border-color:rgba(13,45,92,.35); background:#f5f8ff; }
    /* Swipe-reveal backgrounds, Gmail-style: left = delete, right = read.
       Both sit under the row (which slides on top of them) and are shown
       one at a time depending on drag direction — see attachSwipe() in
       notifications-page.js. */
    .notif-swipe-bg{
      position:absolute; inset:0; display:flex; align-items:center; gap:.4rem;
      font-weight:800; font-size:.85rem; border-radius:.9rem; opacity:0;
      transition:opacity .15s ease; padding:0 1.1rem;
    }
    .notif-swipe-bg.show{ opacity:1; }
    .notif-swipe-bg-read{ background:#e4f8ea; color:#1c7a3a; justify-content:flex-start; }
    .notif-swipe-bg-delete{ background:#fdeaea; color:#a3312f; justify-content:flex-end; }
    .notif-emoji{ font-size:1.3rem; flex:none; }
    .notif-count{
      font-weight:800; font-size:.7rem; color:#fff; background:var(--blue);
      border-radius:999px; padding:.05rem .45rem; margin-inline-start:.35rem; flex:none;
    }
    .notif-text{ flex:1; min-width:0; font-size:.88rem; }
    .notif-text b{ color:var(--ink); }
    .notif-time{ font-size:.7rem; opacity:.6; flex:none; }
    .empty-note{ padding:1rem; text-align:center; opacity:.6; font-size:.88rem; }
    .signin-note{ padding:1rem; }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <button class="icon-btn topbar-back" type="button" aria-label="Back">‹</button>
      <h1>ការជូនដំណឹង (Notifications)</h1>
      <div class="spacer"></div>
      <div class="topbar-menu" id="notifMenu" hidden>
        <button class="icon-btn" id="btnNotifMenu" type="button" aria-label="More options">⋮</button>
        <div class="topbar-menu-list" id="notifMenuList" hidden>
          <button type="button" id="btnMarkAllRead">Mark all read</button>
          <button type="button" id="btnDeleteAll" class="danger">Delete all</button>
        </div>
      </div>
    </header>

    <main class="page">
      <div id="notifRoot"><p>No notifications yet.</p></div>
    </main>

    <!-- Auto-hide bottom nav -->
    <footer id="appTabbar" class="home-nav">
      <a class="nav-item" href="index.html">
        <img class="ni-img" src="assets/ui/nav-home.png" alt=""><span data-i18n="nav.home">Home</span>
      </a>
      <a class="nav-item" href="friends.html">
        <img class="ni-img" src="assets/ui/nav-friends.png" alt=""><span data-i18n="nav.friend">Friend</span>
      </a>
      <a class="nav-item" href="play.html">
        <img class="ni-img" src="assets/ui/nav-play.png" alt=""><span data-i18n="nav.play">Play</span>
      </a>
      <a class="nav-item" href="settings.html">
        <img class="ni-img" src="assets/ui/nav-settings.png" alt=""><span data-i18n="nav.setting">Setting</span>
      </a>
      <a class="nav-item active" href="notifications.html" aria-current="page">
        <img class="ni-img" src="assets/ui/nav-bell.png" alt=""><span data-i18n="nav.notification">Notification</span>
      </a>
    </footer>
    <div id="bottomSpacer" aria-hidden="true"></div>
  </div>

  <script>
    (function(){
      const bar = document.getElementById('appTabbar');
      const spacer = document.getElementById('bottomSpacer');
      if(!bar || !spacer) return;

      function setSpacer(){ spacer.style.height = bar.offsetHeight + 'px'; }
      if (document.readyState === 'complete') setSpacer(); else window.addEventListener('load', setSpacer);
      window.addEventListener('resize', setSpacer);

      const page = (location.pathname.split('/').pop() || 'notifications.html');
      for(const a of bar.querySelectorAll('a')){
        if(a.getAttribute('href') === page) a.classList.add('active');
      }

      let last = window.scrollY;
      window.addEventListener('scroll', () => {
        const y = window.scrollY;
        bar.style.transform = (y > last) ? 'translateY(110%)' : 'translateY(0)';
        last = y;
      }, { passive:true });
    })();
  </script>
</body>
</html>
