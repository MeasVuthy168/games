<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no" />
  <script src="js/theme-init.js"></script>
  <title>អុកចត្រង្គ (Khmer Chess)</title>

  <!-- Font -->
  <link rel="preload" as="font" href="assets/fonts/Krasar-Regular.ttf" type="font/ttf" crossorigin>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0d2d5c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <script src="js/pwa.js" defer></script>
  <script type="module" src="js/notif-badge.js"></script>

  <!-- Board textures -->
  <style>
    :root{
      --board-light-img: url("assets/board/wood_light.jpg");
      --board-dark-img:  url("assets/board/wood_dark.jpg");
    }
    /* AI/local-friend games have no chat form below the board, so the
       page never needs to scroll at all — locking it stops an accidental
       drag near the board's edge from nudging the whole page instead of
       just interacting with the board. Online games DO have a real chat
       form that can sit below the fold, so js/ui.js only adds this class
       when it's NOT an online game (see applyPlayerLabels() area). */
    html.board-locked, body.board-locked{ height:100%; overflow:hidden; }
    body.board-locked .app{ height:100dvh; min-height:0; }
  </style>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app">
    <!-- Top-right "more" menu — Reset/Pause/Undo/Fullscreen all live here
         instead of their own button rows, freeing up board space. Reset/
         Pause/Undo are wrapped in #localControls (unchanged id) so
         js/ui.js's existing online-mode hide still applies to just those
         3; Fullscreen sits outside it so it stays available in online
         mode too (see initFullscreenButton() in js/ui.js). -->
    <header class="topbar">
      <div class="spacer"></div>
      <div class="topbar-menu" id="playMenu">
        <button class="icon-btn" id="btnPlayMenu" type="button" aria-label="More options">⋮</button>
        <div class="topbar-menu-list" id="playMenuList" hidden>
          <div id="localControls">
            <button id="btnReset" type="button">
              <img src="assets/ui/reset.png" width="18" height="18" alt="">
              <span data-i18n="play.menu.reset">ចាប់ផ្ដើមថ្មី</span>
            </button>
            <button id="btnPause" type="button">
              <img src="assets/ui/pause.png" width="18" height="18" alt="">
              <span data-i18n="play.menu.pause">ផ្អាក</span>
            </button>
            <button id="btnUndo" type="button">
              <img src="assets/ui/undo.png" width="18" height="18" alt="">
              <span data-i18n="play.menu.undo">ថយក្រោយ</span>
            </button>
          </div>
          <button id="btnFullscreen" type="button" hidden>
            <svg id="fsEnterIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/>
            </svg>
            <svg id="fsExitIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
              <path d="M9 3v3a2 2 0 0 1-2 2H4M15 3v3a2 2 0 0 0 2 2h3M9 21v-3a2 2 0 0 0-2-2H4M15 21v-3a2 2 0 0 1 2-2h3"/>
            </svg>
            <span id="fsLabel" data-i18n="play.menu.fullscreenEnter">ពេញអេក្រង់</span>
          </button>
        </div>
      </div>
    </header>

    <main class="layout layout-single">
      <section class="panel board-panel">

        <!-- Turn + counting draw -->
        <div class="turn-wrap">
          <div id="turnLabel" class="turn-banner">វេនខាង (ស)</div>

          <span id="count-label" class="count-label" style="display:none;">
            ⏳ <b><span id="count-label-prefix" data-i18n="counting.piece">Piece Count</span>: <span id="count-number">–</span></b>
          </span>
          <div id="count-bar" class="count-bar" style="display:none;">
            <div id="count-bar-fill" class="count-bar-fill"></div>
            <span id="count-badge" class="count-badge">–</span>
          </div>
        </div>

        <div id="onlineStatusBanner" class="online-status-banner" hidden></div>

        <!-- Top clock -->
        <div class="timers" id="timersTop">
          <div class="player-row top">
            <div class="player-avatar" id="avatarBlack" hidden></div>
            <div class="player-name" id="nameBlack">ខ្មៅ (Black)</div>
            <div class="clock" id="clockB">10:00.0</div>
            <button id="btnResign" class="btn-icon secondary" title="Resign" type="button" hidden>
              <span>Resign</span>
            </button>
          </div>
        </div>

        <!-- Board -->
        <div id="board" class="board board-wood no-coords" aria-label="Khmer Chess Board"></div>

        <!-- Bottom clock -->
        <div class="timers" id="timersBottom">
          <div class="player-row bottom">
            <div class="player-avatar" id="avatarWhite" hidden></div>
            <div class="player-name" id="nameWhite">ស (White)</div>
            <div class="clock" id="clockW">10:00.0</div>
          </div>
        </div>

        <!-- Chat: only real when playing an online friend — js/ui.js
             replaces this with the real thread and un-hides it; every
             other mode (AI, local pass & play) has no chat, so this stays
             hidden rather than showing a "coming soon" placeholder. -->
        <section id="chatCard" class="panel card chat-panel card-full" hidden>
          <div class="card-left">
            <div class="card-title">សន្ទនា (Chat)</div>
            <div class="card-sub">coming soon</div>
          </div>
        </section>

      </section>
    </main>

    <!-- Bottom nav -->
    <footer id="appTabbar" class="bottom-bar">
      <a class="nav-item" href="index.html"><img class="ni-img" src="assets/ui/nav-home.png" alt=""><span data-i18n="nav.home">Home</span></a>
      <a class="nav-item" href="friends.html"><img class="ni-img" src="assets/ui/nav-friends.png" alt=""><span data-i18n="nav.friend">Friend</span></a>
      <a class="nav-item active" href="play.html" aria-current="page"><img class="ni-img" src="assets/ui/nav-play.png" alt=""><span data-i18n="nav.play">Play</span></a>
      <a class="nav-item" href="settings.html"><img class="ni-img" src="assets/ui/nav-settings.png" alt=""><span data-i18n="nav.setting">Setting</span></a>
      <a class="nav-item" href="notifications.html"><img class="ni-img" src="assets/ui/nav-bell.png" alt=""><span data-i18n="nav.notification">Notification</span></a>
    </footer>
    <div id="bottomSpacer" aria-hidden="true"></div>
  </div>

  <!-- Portrait-only overlay -->
  <div class="orientation-blocker" id="orientationBlock" aria-hidden="true">
    <div class="ob-card">
      សូមប្រើទម្រង់បញ្ឈរ<br/>
      <small>Rotate back to portrait to continue</small>
    </div>
  </div>

  <!-- === RESULT CELEBRATION OVERLAY ===
       Layered per this round's redesign: overlay backdrop (dim/blur +
       result-tinted glow, toggled via #flashOverlay.type-win/lose/draw) ->
       card -> particles (WIN only, JS-populated) -> icon -> title ->
       description -> optional reason line -> optional summary -> actions.
       js/ui.js's presentGameResult()/showEndFlash() are the only code that
       touch this markup — never duplicate that logic elsewhere. -->
  <div id="flashOverlay" aria-hidden="true">
    <div class="flash-card">
      <div class="flash-particles" id="flashParticles" aria-hidden="true"></div>
      <div class="flash-icon" id="flashIcon" aria-hidden="true">🏆</div>
      <h2 class="flash-title" id="flashTitle">អ្នកឈ្នះ!</h2>
      <div class="flash-desc" id="flashSub">អ្នកបានឈ្នះ Master (AI)!</div>
      <div class="flash-reason" id="flashReason" hidden></div>
      <div class="flash-summary" id="flashSummary" hidden>
        <div class="summary-row" id="summaryOpponentRow">
          <span class="summary-label" data-i18n="result.summaryOpponent">Opponent</span>
          <span class="summary-value" id="summaryOpponent"></span>
        </div>
        <div class="summary-row" id="summaryMovesRow">
          <span class="summary-label" data-i18n="result.summaryMoves">Moves</span>
          <span class="summary-value" id="summaryMoves"></span>
        </div>
        <div class="summary-row" id="summaryTimeRow">
          <span class="summary-label" data-i18n="result.summaryTime">Time</span>
          <span class="summary-value" id="summaryTime"></span>
        </div>
      </div>
      <div class="flash-actions">
        <button id="flashAgain" class="flash-btn primary" data-i18n="result.playAgain">ចាប់ផ្ដើមថ្មី</button>
        <button id="flashClose" class="flash-btn secondary" data-i18n="result.close">បិទ</button>
      </div>
    </div>
  </div>

  <!-- JS -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
