<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <script src="js/theme-init.js"></script>
  <script src="js/topbar-back.js" defer></script>
  <title>Sign In | Khmer Chess</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0d2d5c" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <script src="js/pwa.js" defer></script>
  <script type="module" src="js/notif-badge.js"></script>
  <script type="module">
    import { recordLoginToday } from './js/rewards.js';
    recordLoginToday();
  </script>

  <!-- Fill in a real Google OAuth Client ID here to enable "Sign in with
       Google" — see js/auth-page.js, which hides the button entirely when
       this is left blank. -->
  <meta name="google-signin-client-id" content="" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="js/auth-page.js"></script>

  <style>
    .auth-wrap{ max-width:420px; margin:2rem auto; padding:0 1rem; }
    .auth-card{ background:var(--panel); border-radius:1rem; box-shadow:var(--shadow); padding:1.3rem 1.2rem; }
    .auth-title{ font-weight:800; font-size:1.2rem; color:var(--blue); text-align:center; margin:0 0 .3rem; }
    .auth-sub{ text-align:center; opacity:.7; font-size:.85rem; margin:0 0 1rem; }
    .auth-tabs{ display:flex; gap:.5rem; margin-bottom:1rem; }
    .auth-tab{
      flex:1; padding:.6rem; border-radius:.7rem; border:2px solid #e6ecf7; background:#f7f9fd;
      font-weight:700; cursor:pointer; color:var(--blue);
    }
    .auth-tab.active{ border-color:var(--blue); background:#eef4ff; }
    .auth-form{ display:flex; flex-direction:column; gap:.7rem; }
    .auth-form[hidden]{ display:none; }
    .auth-error{ background:#fdeaea; color:#a3312f; border-radius:.6rem; padding:.6rem .7rem; font-size:.85rem; font-weight:700; }
    .auth-ok{ background:#e4f8ea; color:#1c7a3a; border-radius:.6rem; padding:.6rem .7rem; font-size:.85rem; font-weight:700; }
    .auth-link{ text-align:center; font-size:.85rem; }
    .auth-link a{ color:var(--blue); font-weight:700; cursor:pointer; text-decoration:underline; }
    .id-tabs{ display:flex; gap:.4rem; }
    .id-tab{
      flex:1; padding:.4rem; border-radius:.6rem; border:2px solid #e6ecf7; background:#f7f9fd;
      font-weight:700; font-size:.85rem; cursor:pointer; color:var(--blue);
    }
    .id-tab.active{ border-color:var(--blue); background:#eef4ff; }
    .id-group[hidden]{ display:none; }
    .field-row{ display:flex; gap:.5rem; align-items:flex-end; }
    .field-row .field{ flex:1; }
    .field-row button{ white-space:nowrap; }
    .google-signin-wrap{ display:flex; justify-content:center; margin-bottom:.8rem; }
    .auth-divider{ display:flex; align-items:center; gap:.6rem; margin:0 0 .8rem; color:var(--ink); opacity:.55; font-size:.8rem; font-weight:700; }
    .auth-divider::before, .auth-divider::after{ content:""; flex:1; height:1px; background:currentColor; opacity:.3; }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <button class="icon-btn topbar-back" type="button" aria-label="Back">‹</button>
      <h1>ចូល / ចុះឈ្មោះ (Account)</h1>
      <div class="spacer"></div>
    </header>

    <main class="page settings-page auth-wrap">
      <div class="auth-card">
        <h1 class="auth-title">អុកចត្រង្គ</h1>
        <p class="auth-sub">Sign in to add friends, chat, and get notifications.</p>

        <div class="auth-tabs">
          <button class="auth-tab active" id="tabSignIn" type="button">Sign In</button>
          <button class="auth-tab" id="tabSignUp" type="button">Sign Up</button>
        </div>

        <div id="googleSignInSection" hidden>
          <div class="google-signin-wrap"><div id="googleSignInBtn"></div></div>
          <div class="auth-divider"><span>or</span></div>
        </div>

        <div id="authMsg"></div>

        <form class="auth-form" id="formSignIn" onsubmit="return false">
          <label class="field"><span>Email or phone number</span><input type="text" id="siIdentifier" required autocomplete="username" /></label>
          <label class="field"><span>Password</span><input type="password" id="siPassword" required autocomplete="current-password" /></label>
          <button class="primary" type="submit">Sign In</button>
          <div class="auth-link"><a id="linkForgot">Forgot password?</a></div>
        </form>

        <form class="auth-form" id="formSignUp" hidden onsubmit="return false">
          <label class="field"><span>Display name</span><input type="text" id="suName" maxlength="40" required autocomplete="nickname" /></label>

          <div class="id-tabs">
            <button class="id-tab active" id="suModeEmail" type="button">Email</button>
            <button class="id-tab" id="suModePhone" type="button">Phone</button>
          </div>

          <div class="id-group" id="suEmailGroup">
            <div class="field-row">
              <label class="field"><span>Email</span><input type="email" id="suEmail" autocomplete="email" /></label>
              <button class="secondary" id="btnSendEmailCode" type="button">Send code</button>
            </div>
            <label class="field" id="suEmailCodeField" hidden><span>Verification code</span><input type="text" id="suEmailCode" inputmode="numeric" autocomplete="one-time-code" /></label>
          </div>

          <div class="id-group" id="suPhoneGroup" hidden>
            <div class="field-row">
              <label class="field"><span>Phone number</span><input type="tel" id="suPhone" placeholder="+85512345678" autocomplete="tel" /></label>
              <button class="secondary" id="btnSendCode" type="button">Send code</button>
            </div>
            <label class="field" id="suCodeField" hidden><span>Verification code</span><input type="text" id="suCode" inputmode="numeric" autocomplete="one-time-code" /></label>
          </div>

          <label class="field"><span>Password (min 8 characters)</span><input type="password" id="suPassword" minlength="8" required autocomplete="new-password" /></label>
          <button class="primary" type="submit">Create Account</button>
        </form>

        <form class="auth-form" id="formForgot" hidden onsubmit="return false">
          <p class="card-sub">Enter your email and we'll send a reset link.</p>
          <label class="field"><span>Email</span><input type="email" id="fpEmail" required autocomplete="email" /></label>
          <button class="primary" type="submit">Send Reset Link</button>
          <div class="auth-link"><a id="linkBackToSignIn">Back to sign in</a></div>
        </form>
      </div>
    </main>

    <footer id="appTabbar" class="home-nav">
      <a class="nav-item" href="index.html"><img class="ni-img" src="assets/ui/nav-home.png" alt=""><span data-i18n="nav.home">Home</span></a>
      <a class="nav-item" href="friends.html"><img class="ni-img" src="assets/ui/nav-friends.png" alt=""><span data-i18n="nav.friend">Friend</span></a>
      <a class="nav-item" href="play.html"><img class="ni-img" src="assets/ui/nav-play.png" alt=""><span data-i18n="nav.play">Play</span></a>
      <a class="nav-item" href="settings.html"><img class="ni-img" src="assets/ui/nav-settings.png" alt=""><span data-i18n="nav.setting">Setting</span></a>
      <a class="nav-item" href="notifications.html"><img class="ni-img" src="assets/ui/nav-bell.png" alt=""><span data-i18n="nav.notification">Notification</span></a>
    </footer>
    <div id="bottomSpacer" aria-hidden="true"></div>
  </div>

  <script>
    (function(){
      const bar = document.getElementById('appTabbar');
      const spacer = document.getElementById('bottomSpacer');
      if(!bar || !spacer) return;
      function setSpacer(){ spacer.style.height = bar.offsetHeight + 'px'; }
      if (document.readyState === 'complete') setSpacer(); else window.addEventListener('load', setSpacer);
      window.addEventListener('resize', setSpacer);
    })();
  </script>
</body>
</html>
