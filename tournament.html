<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no" />
  <script src="js/theme-init.js"></script>
  <script src="js/topbar-back.js" defer></script>
  <title>Tournament | Khmer Chess</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0d2d5c" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <script src="js/pwa.js" defer></script>
  <script type="module" src="js/notif-badge.js"></script>

  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="js/tournament-page.js"></script>

  <style>
    .tourn-hero{
      flex-direction:column; align-items:center; gap:.5rem;
      padding:1.4rem 1rem 1.2rem !important; text-align:center;
    }
    .tourn-hero .tourn-emoji{ font-size:2.4rem; }
    .tourn-hero .tourn-status{ font-weight:800; font-size:1.15rem; color:var(--blue); }
    .tourn-hero .tourn-sub{ opacity:.7; font-weight:600; font-size:.88rem; }
    .tourn-hero .tourn-reward{ margin-top:.3rem; }

    .round-list{ display:flex; flex-direction:column; gap:.6rem; padding:0 1rem 1.1rem; }
    .round-row{
      display:flex; align-items:center; gap:.8rem;
      background:var(--panel); border-radius:.9rem; box-shadow:var(--shadow);
      padding:.7rem .9rem; border:1px solid rgba(13,45,92,.06);
    }
    .round-row.is-current{ border-color:var(--blue); box-shadow:0 0 0 2px rgba(13,45,92,.15); }
    .round-num{
      width:34px; height:34px; border-radius:50%; flex:none;
      display:flex; align-items:center; justify-content:center;
      font-weight:800; background:var(--chip-bg); color:var(--blue);
    }
    .round-row.is-won .round-num{ background:#e4f8ea; color:#1c7a3a; }
    .round-row.is-lost .round-num{ background:#fdeaea; color:#a3312f; }
    .round-meta{ flex:1; min-width:0; }
    .round-title{ font-weight:700; font-size:.95rem; color:var(--ink); }
    .round-sub{ font-size:.78rem; opacity:.65; font-weight:600; }
    .round-badge{ font-weight:800; font-size:1.2rem; flex:none; }

    .stat-row{ display:flex; gap:.6rem; padding:0 1rem 1.1rem; }
    .stat-tile{
      flex:1; background:var(--panel); border-radius:.9rem; box-shadow:var(--shadow);
      padding:.6rem .5rem; text-align:center; border:1px solid rgba(13,45,92,.06);
    }
    .stat-tile .stat-value{ font-weight:800; font-size:1.1rem; color:var(--blue); }
    .stat-tile .stat-label{ font-size:.7rem; opacity:.7; font-weight:700; margin-top:.1rem; }

    .tourn-actions{ display:flex; gap:.6rem; padding:0 1rem 1.2rem; }
    .tourn-actions button{
      flex:1; padding:.8rem 1rem; border-radius:.8rem; border:none;
      font-weight:800; font-size:.98rem; cursor:pointer;
    }
    .tourn-actions button:active{ transform:scale(.98); }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <button class="icon-btn topbar-back" type="button" aria-label="Back">‹</button>
      <h1>ការប្រកួត (Tournament)</h1>
      <div class="spacer"></div>
    </header>

    <main class="page settings-page">
      <section class="tourn-hero card card-full">
        <div class="tourn-emoji" id="tournEmoji">🏆</div>
        <div class="tourn-status" id="tournStatus">Not started</div>
        <div class="tourn-sub" id="tournSub">Beat the local AI through 4 rounds of rising difficulty.</div>
        <div class="pill tourn-reward" id="tournReward">Reward: 500 coins</div>
      </section>

      <div class="round-list" id="roundList"></div>

      <div class="stat-row">
        <div class="stat-tile">
          <div class="stat-value" id="statWon">0</div>
          <div class="stat-label">Tournaments Won</div>
        </div>
        <div class="stat-tile">
          <div class="stat-value" id="statPlayed">0</div>
          <div class="stat-label">Tournaments Played</div>
        </div>
      </div>

      <div class="tourn-actions">
        <button class="primary" id="btnAction" type="button">Start Tournament</button>
      </div>
    </main>

    <!-- Bottom nav: same 5 items as every other page. Tournament isn't a
         tab of its own — it's reached from Home, so Home stays lit. -->
    <footer id="appTabbar" class="home-nav">
      <a class="nav-item active" href="index.html">
        <img class="ni-img" src="assets/ui/nav-home.png" alt=""><span data-i18n="nav.home">Home</span>
      </a>
      <a class="nav-item" href="friends.html">
        <img class="ni-img" src="assets/ui/nav-friends.png" alt=""><span data-i18n="nav.friend">Friend</span>
      </a>
      <a class="nav-item" href="play.html">
        <img class="ni-img" src="assets/ui/nav-play.png" alt=""><span data-i18n="nav.play">Play</span>
      </a>
      <a class="nav-item" href="settings.html">
        <img class="ni-img" src="assets/ui/nav-settings.png" alt=""><span data-i18n="nav.setting">Setting</span>
      </a>
      <a class="nav-item" href="notifications.html">
        <img class="ni-img" src="assets/ui/nav-bell.png" alt=""><span data-i18n="nav.notification">Notification</span>
      </a>
    </footer>
    <div id="bottomSpacer" aria-hidden="true"></div>
  </div>

  <script>
    (function(){
      const bar = document.getElementById('appTabbar');
      const spacer = document.getElementById('bottomSpacer');
      if(!bar || !spacer) return;
      function setSpacer(){ spacer.style.height = bar.offsetHeight + 'px'; }
      if (document.readyState === 'complete') setSpacer(); else window.addEventListener('load', setSpacer);
      window.addEventListener('resize', setSpacer);
    })();
  </script>
</body>
</html>
