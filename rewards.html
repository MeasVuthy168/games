<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Daily Rewards | Khmer Chess</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0d2d5c" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <script src="js/pwa.js" defer></script>
  <script type="module" src="js/notif-badge.js"></script>

  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="js/rewards-page.js"></script>

  <style>
    .rewards-hero{
      flex-direction:column; align-items:center; gap:.4rem;
      padding:1.3rem 1rem 1.1rem !important; text-align:center;
    }
    .rewards-hero .rewards-emoji{ font-size:2.2rem; }
    .rewards-hero .rewards-streak{ font-weight:800; font-size:1.1rem; color:var(--blue); }
    .rewards-hero .rewards-sub{ opacity:.7; font-weight:600; font-size:.85rem; }

    .obj-list{ display:flex; flex-direction:column; gap:.7rem; padding:0 1rem 1.3rem; }
    .obj-card{
      background:var(--panel); border-radius:1rem; box-shadow:var(--shadow);
      padding:.8rem .9rem; border:1px solid rgba(13,45,92,.06);
    }
    .obj-top{ display:flex; align-items:center; justify-content:space-between; gap:.6rem; margin-bottom:.45rem; }
    .obj-title{ font-weight:800; font-size:.94rem; color:var(--ink); }
    .obj-reward{ font-weight:800; font-size:.82rem; color:var(--blue); flex:none; }
    .obj-bar{ height:10px; border-radius:999px; background:#eef1f6; overflow:hidden; }
    .obj-bar-fill{ height:100%; background:var(--blue); border-radius:999px; transition:width .2s ease; }
    .obj-card.is-complete .obj-bar-fill{ background:#1c7a3a; }
    .obj-bottom{ display:flex; align-items:center; justify-content:space-between; margin-top:.5rem; gap:.6rem; }
    .obj-progress-text{ font-size:.78rem; opacity:.7; font-weight:700; }
    .obj-claim{
      border:none; border-radius:.7rem; padding:.45rem .9rem; font-weight:800; font-size:.82rem; cursor:pointer;
    }
    .obj-claim.can-claim{ background:var(--blue); color:#fff; }
    .obj-claim.claimed{ background:#e4f8ea; color:#1c7a3a; cursor:default; }
    .obj-claim[disabled]:not(.claimed){ background:#eef1f5; color:#8a93a3; cursor:default; }
  </style>
</head>
<body>
  <div class="shell">
    <main class="page settings-page">
      <section class="rewards-hero card card-full">
        <div class="rewards-emoji">🎁</div>
        <div class="rewards-streak" id="streakLine">Login streak: 0 days</div>
        <div class="rewards-sub">Complete objectives from real games to earn coins.</div>
      </section>

      <div class="obj-list" id="objList"></div>
    </main>

    <!-- Bottom nav: same 5 items as every other page. Rewards isn't a tab
         of its own — it's reached from Home, so Home stays lit. -->
    <footer id="appTabbar" class="home-nav">
      <a class="nav-item active" href="index.html">
        <img class="ni-img" src="assets/ui/nav-home.png" alt=""><span>Home</span>
      </a>
      <a class="nav-item" href="friends.html">
        <img class="ni-img" src="assets/ui/nav-friends.png" alt=""><span>Friend</span>
      </a>
      <a class="nav-item" href="play.html">
        <img class="ni-img" src="assets/ui/nav-play.png" alt=""><span>Play</span>
      </a>
      <a class="nav-item" href="settings.html">
        <img class="ni-img" src="assets/ui/nav-settings.png" alt=""><span>Setting</span>
      </a>
      <a class="nav-item" href="notifications.html">
        <img class="ni-img" src="assets/ui/nav-bell.png" alt=""><span>Notification</span>
      </a>
    </footer>
    <div id="bottomSpacer" aria-hidden="true"></div>
  </div>

  <script>
    (function(){
      const bar = document.getElementById('appTabbar');
      const spacer = document.getElementById('bottomSpacer');
      if(!bar || !spacer) return;
      function setSpacer(){ spacer.style.height = bar.offsetHeight + 'px'; }
      if (document.readyState === 'complete') setSpacer(); else window.addEventListener('load', setSpacer);
      window.addEventListener('resize', setSpacer);
    })();
  </script>
</body>
</html>
