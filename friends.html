<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <script src="js/theme-init.js"></script>
  <script src="js/topbar-back.js" defer></script>
  <title>Friend | Khmer Chess</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0d2d5c" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <script src="js/pwa.js" defer></script>
  <script type="module" src="js/notif-badge.js"></script>
  <script type="module">
    import { recordLoginToday } from './js/rewards.js';
    recordLoginToday();
  </script>

  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="js/friends-page.js"></script>
  <style>
    .page{ padding:1rem; line-height:1.6; }
    .page .btn{
      display:inline-block; margin:.4rem 0; padding:.7rem 1.1rem; border-radius:.75rem;
      background:#0d2d5c; color:#fff; text-decoration:none; font-weight:700;
    }
    .page .muted{ opacity:.7; font-size:.92rem; }

    .online-section{ margin-top:1.2rem; }
    .online-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:.6rem; }
    .online-header h3{ margin:0; font-size:1rem; color:var(--blue); }
    .signed-in-as{ font-size:.8rem; opacity:.7; }
    .signed-in-as button{ background:none; border:none; color:var(--blue); font-weight:700; cursor:pointer; text-decoration:underline; padding:0; margin-left:.4rem; }

    .search-row{ display:flex; gap:.5rem; margin-bottom:.8rem; }
    .search-row input{ flex:1; padding:.6rem .7rem; border-radius:.6rem; border:1px solid #d7dee8; font:inherit; }
    .search-row button{ padding:.6rem 1rem; border-radius:.6rem; border:none; background:var(--blue); color:#fff; font-weight:700; cursor:pointer; }

    .person-row{
      display:flex; align-items:center; gap:.6rem; padding:.6rem .7rem;
      background:var(--panel); border-radius:.8rem; box-shadow:var(--shadow); margin-bottom:.5rem;
      border:1px solid rgba(13,45,92,.06);
    }
    .person-emoji{ font-size:1.4rem; width:32px; text-align:center; flex:none; }
    .person-name{ flex:1; font-weight:700; font-size:.92rem; min-width:0; }
    .person-actions{ display:flex; gap:.4rem; flex:none; }
    .person-actions button{
      padding:.4rem .7rem; border-radius:.6rem; border:none; font-weight:700; font-size:.78rem; cursor:pointer;
    }
    .btn-accept{ background:var(--blue); color:#fff; }
    .btn-decline{ background:#fdeaea; color:#a3312f; }
    .btn-message{ background:#eef4ff; color:var(--blue); }
    .btn-remove{ background:#f2f2f2; color:#555; }
    .btn-play{ background:#e4f8ea; color:#1c7a3a; }
    .empty-note{ font-size:.82rem; opacity:.6; padding:.3rem 0 .8rem; }
    .section-label{ font-weight:700; font-size:.82rem; opacity:.7; margin:.8rem 0 .4rem; }
    .person-sub{ font-size:.72rem; opacity:.6; font-weight:600; }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <button class="icon-btn topbar-back" type="button" aria-label="Back">‹</button>
      <h1>មិត្តភក្តិ (Friends)</h1>
      <div class="spacer"></div>
    </header>

    <main class="page">
      <section class="online-section" id="signedOutView" hidden>
        <div class="card card-full clickable" id="btnGoSignIn" style="cursor:pointer">
          <div class="card-left">
            <div class="card-title" data-i18n="friends.signedOut.title">Sign in for real online friends</div>
            <div class="card-sub" data-i18n="friends.signedOut.sub">Add friends by email, chat, and get notifications</div>
          </div>
          <div class="card-right">›</div>
        </div>
      </section>

      <section class="online-section" id="signedInView" hidden>
        <div class="online-header">
          <h3 data-i18n="friends.onlineFriends">Online Friends</h3>
          <div class="signed-in-as"><span data-i18n="friends.signedInAs">Signed in as</span> <strong id="meName"></strong><button id="btnSignOut" type="button" data-i18n="friends.signOut">Sign out</button></div>
        </div>

        <div class="search-row">
          <input type="text" id="searchInput" placeholder="Search by name or email…" data-i18n-placeholder="friends.searchPlaceholder" />
          <button id="btnSearch" type="button" data-i18n="friends.search">Search</button>
        </div>
        <div id="searchResults"></div>

        <div class="section-label" id="incomingLabel" hidden data-i18n="friends.requests">Friend Requests</div>
        <div id="incomingList"></div>

        <div class="section-label" id="gamesLabel" hidden data-i18n="friends.games">Games</div>
        <div id="gamesList"></div>

        <div class="section-label" data-i18n="friends.myFriends">My Friends</div>
        <div id="friendsList"></div>
        <div class="empty-note" id="friendsEmpty" hidden data-i18n="friends.empty">No friends yet — search above to add some.</div>
      </section>
    </main>

    <!-- Auto-hide bottom nav -->
    <footer id="appTabbar" class="home-nav">
      <a class="nav-item" href="index.html">
        <img class="ni-img" src="assets/ui/nav-home.png" alt=""><span data-i18n="nav.home">Home</span>
      </a>
      <a class="nav-item active" href="friends.html" aria-current="page">
        <img class="ni-img" src="assets/ui/nav-friends.png" alt=""><span data-i18n="nav.friend">Friend</span>
      </a>
      <a class="nav-item" href="play.html">
        <img class="ni-img" src="assets/ui/nav-play.png" alt=""><span data-i18n="nav.play">Play</span>
      </a>
      <a class="nav-item" href="settings.html">
        <img class="ni-img" src="assets/ui/nav-settings.png" alt=""><span data-i18n="nav.setting">Setting</span>
      </a>
      <a class="nav-item" href="notifications.html">
        <img class="ni-img" src="assets/ui/nav-bell.png" alt=""><span data-i18n="nav.notification">Notification</span>
      </a>
    </footer>
    <div id="bottomSpacer" aria-hidden="true"></div>
  </div>

  <script>
    (function(){
      const bar = document.getElementById('appTabbar');
      const spacer = document.getElementById('bottomSpacer');
      if(!bar || !spacer) return;

      function setSpacer(){ spacer.style.height = bar.offsetHeight + 'px'; }
      if (document.readyState === 'complete') setSpacer(); else window.addEventListener('load', setSpacer);
      window.addEventListener('resize', setSpacer);

      // highlight
      const page = (location.pathname.split('/').pop() || 'friends.html');
      for(const a of bar.querySelectorAll('a')){
        if(a.getAttribute('href') === page) a.classList.add('active');
      }

      // auto-hide
      let last = window.scrollY;
      window.addEventListener('scroll', () => {
        const y = window.scrollY;
        bar.style.transform = (y > last) ? 'translateY(110%)' : 'translateY(0)';
        last = y;
      }, { passive:true });
    })();
  </script>
</body>
</html>
