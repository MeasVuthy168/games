<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no" />
  <script src="js/theme-init.js"></script>
  <script src="js/topbar-back.js" defer></script>
  <title>Chat | Khmer Chess</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0d2d5c" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <script src="js/pwa.js" defer></script>
  <script type="module" src="js/notif-badge.js"></script>
  <script type="module">
    import { recordLoginToday } from './js/rewards.js';
    recordLoginToday();
  </script>

  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="js/chat-page.js"></script>

  <style>
    .chat-list{ padding:1rem; display:flex; flex-direction:column; gap:.6rem; }
    .conv-row{
      display:flex; align-items:center; gap:.7rem; padding:.7rem .8rem;
      background:var(--panel); border-radius:.9rem; box-shadow:var(--shadow);
      border:1px solid rgba(13,45,92,.06); cursor:pointer;
    }
    .conv-row:active{ transform:scale(.99); }
    .conv-emoji{ font-size:1.6rem; flex:none; }
    .conv-meta{ flex:1; min-width:0; }
    .conv-name{ font-weight:800; font-size:.95rem; }
    .conv-preview{ font-size:.8rem; opacity:.65; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .conv-badge{
      background:var(--blue); color:#fff; font-weight:800; font-size:.72rem;
      border-radius:999px; padding:.15rem .5rem; flex:none;
    }
    .empty-note{ padding:1rem; text-align:center; opacity:.6; font-size:.88rem; }

    /* Thread view */
    .thread-wrap{ position:relative; display:flex; flex-direction:column; height:calc(100dvh - 130px); }
    .thread-header{ display:flex; align-items:center; gap:.6rem; padding:.8rem 1rem; border-bottom:1px solid rgba(13,45,92,.08); }
    .thread-header a{ color:var(--blue); font-weight:800; text-decoration:none; font-size:1.2rem; }
    .thread-header-meta{ display:flex; flex-direction:column; line-height:1.25; min-width:0; }
    .thread-header .thread-name{ font-weight:800; }
    .thread-presence{ font-size:.72rem; opacity:.6; }
    .thread-presence.is-online{ opacity:1; color:var(--blue); font-weight:700; }
    .thread-msgs{ flex:1; overflow-y:auto; padding:1rem; display:flex; flex-direction:column; gap:.5rem; }
    .msg-row{ display:flex; }
    .msg-row.me{ justify-content:flex-end; }
    .msg-group{ display:flex; flex-direction:column; max-width:75%; }
    .msg-row.me .msg-group{ align-items:flex-end; }
    .msg-bubble{
      padding:.55rem .8rem; border-radius:1rem; font-size:.9rem; line-height:1.35;
      background:var(--bubble-bg); color:var(--ink);
    }
    .msg-row.me .msg-bubble{ background:var(--blue); color:#fff; }
    .msg-time{ font-size:.68rem; opacity:.55; margin:.2rem .35rem 0; }
    .thread-composer{ display:flex; align-items:center; gap:.5rem; padding:.7rem 1rem; border-top:1px solid rgba(13,45,92,.08); }
    .thread-composer input{ flex:1; min-width:0; padding:.6rem .8rem; border-radius:1.2rem; border:1px solid #d7dee8; font:inherit; }
    .thread-composer button{
      flex:none; padding:.55rem 1.1rem; border-radius:1.2rem; border:none; background:var(--blue); color:#fff; font-weight:800; cursor:pointer;
    }
    .emoji-btn{
      flex:none; background:none !important; border:none; font-size:1.4rem; line-height:1; padding:.2rem .3rem !important;
      cursor:pointer;
    }
    .emoji-panel{
      display:grid; grid-template-columns:repeat(8, 1fr); gap:.15rem; padding:.6rem;
      max-height:220px; overflow-y:auto; border-top:1px solid rgba(13,45,92,.08); background:var(--panel);
    }
    .emoji-panel[hidden]{ display:none; }
    .emoji-item{
      border:none; background:none; font-size:1.4rem; line-height:1; padding:.35rem; border-radius:.5rem; cursor:pointer;
    }
    .emoji-item:active{ background:var(--bubble-bg); }
    /* Consecutive messages from the same sender sit closer together —
       Phase 15 grouping (still gets its own timestamp line, just tighter). */
    .msg-row.grouped{ margin-top:-.3rem; }

    .date-sep{
      align-self:center; font-size:.72rem; font-weight:700; opacity:.55;
      background:var(--bubble-bg); border-radius:999px; padding:.2rem .7rem;
      margin:.4rem 0;
    }

    .load-older-spinner{
      align-self:center; font-size:.75rem; opacity:.55; padding:.3rem 0;
    }

    .new-msgs-pill{
      position:absolute; left:50%; transform:translateX(-50%); bottom:78px;
      background:var(--blue); color:#fff; border:none; border-radius:999px;
      padding:.4rem .9rem; font-size:.78rem; font-weight:700; box-shadow:var(--shadow);
      cursor:pointer; z-index:2;
    }

    .msg-row.is-pending .msg-bubble{ opacity:.65; }
    .msg-row.is-failed .msg-bubble{ outline:1px solid #d33; }
    .msg-row.is-failed .msg-time{ color:#d33; opacity:1; }
    .msg-row.status-read .msg-time{ color:var(--blue); opacity:1; }

    .typing-indicator{
      padding:.2rem 1rem .4rem; font-size:.78rem; font-style:italic; opacity:.65; min-height:1.1em;
    }
    .typing-indicator:empty, .typing-indicator[hidden]{ display:none; }

    /* Pinned message banner */
    .pinned-banner{
      display:block; width:100%; text-align:left; border:none; border-bottom:1px solid rgba(13,45,92,.08);
      background:var(--bubble-bg); color:var(--ink); padding:.5rem 1rem; font-size:.8rem;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer;
    }

    /* Reply quote shown inside a bubble that IS a reply */
    .reply-quote{
      font-size:.78rem; opacity:.75; border-left:2px solid currentColor; padding:.1rem .5rem;
      margin-bottom:.3rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%;
    }
    .msg-bubble-text{ white-space:pre-wrap; overflow-wrap:break-word; }
    .msg-bubble-text.is-deleted{ font-style:italic; opacity:.65; }

    /* Reply preview above the composer, while composing a reply */
    .reply-preview{
      display:flex; align-items:center; gap:.6rem; padding:.5rem 1rem;
      border-top:1px solid rgba(13,45,92,.08); background:var(--bubble-bg);
    }
    .reply-preview-text{ flex:1; min-width:0; }
    .reply-preview-label{ font-size:.7rem; font-weight:700; opacity:.6; }
    .reply-preview-body{ font-size:.82rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .reply-preview-cancel{
      flex:none; border:none; background:none; font-size:1rem; opacity:.6; cursor:pointer; padding:.2rem .4rem;
    }

    /* Long-press action menu (bottom sheet) */
    .msg-menu-overlay{
      position:fixed; inset:0; background:rgba(0,0,0,.35); display:flex; align-items:flex-end;
      z-index:50;
    }
    .msg-menu-overlay[hidden]{ display:none; }
    .msg-menu{
      width:100%; background:var(--panel); border-radius:1rem 1rem 0 0; padding:.4rem 0 calc(.4rem + env(safe-area-inset-bottom));
      box-shadow:var(--shadow); max-height:70vh; overflow-y:auto;
    }
    .msg-menu-item{
      display:block; width:100%; text-align:left; border:none; background:none; color:var(--ink);
      font:inherit; font-size:.95rem; padding:.85rem 1.2rem; cursor:pointer;
    }
    .msg-menu-item:active{ background:var(--bubble-bg); }

    /* Message info modal */
    .info-modal-overlay{
      position:fixed; inset:0; background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center;
      z-index:50; padding:1rem;
    }
    .info-modal-overlay[hidden]{ display:none; }
    .info-modal{
      width:100%; max-width:320px; background:var(--panel); border-radius:1rem; padding:1.1rem;
      box-shadow:var(--shadow);
    }
    .info-modal h3{ margin:0 0 .7rem; font-size:1rem; }
    .info-row{ display:flex; justify-content:space-between; font-size:.85rem; padding:.3rem 0; opacity:.85; }
    .info-modal-close{
      margin-top:.8rem; width:100%; padding:.55rem; border-radius:.8rem; border:none;
      background:var(--blue); color:#fff; font-weight:700; cursor:pointer;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <button class="icon-btn topbar-back" type="button" aria-label="Back">‹</button>
      <h1>ជជែក (Chat)</h1>
      <div class="spacer"></div>
    </header>

    <main class="page">
      <div id="listView"></div>
      <div id="threadView" hidden></div>
    </main>

    <footer id="appTabbar" class="home-nav">
      <a class="nav-item" href="index.html"><img class="ni-img" src="assets/ui/nav-home.png" alt=""><span data-i18n="nav.home">Home</span></a>
      <a class="nav-item active" href="friends.html"><img class="ni-img" src="assets/ui/nav-friends.png" alt=""><span data-i18n="nav.friend">Friend</span></a>
      <a class="nav-item" href="play.html"><img class="ni-img" src="assets/ui/nav-play.png" alt=""><span data-i18n="nav.play">Play</span></a>
      <a class="nav-item" href="settings.html"><img class="ni-img" src="assets/ui/nav-settings.png" alt=""><span data-i18n="nav.setting">Setting</span></a>
      <a class="nav-item" href="notifications.html"><img class="ni-img" src="assets/ui/nav-bell.png" alt=""><span data-i18n="nav.notification">Notification</span></a>
    </footer>
    <div id="bottomSpacer" aria-hidden="true"></div>
  </div>

  <script>
    (function(){
      const bar = document.getElementById('appTabbar');
      const spacer = document.getElementById('bottomSpacer');
      if(!bar || !spacer) return;
      function setSpacer(){ spacer.style.height = bar.offsetHeight + 'px'; }
      if (document.readyState === 'complete') setSpacer(); else window.addEventListener('load', setSpacer);
      window.addEventListener('resize', setSpacer);
    })();
  </script>
</body>
</html>
