<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>AI vs AI (Dev) | Khmer Chess</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0d2d5c" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <script src="js/pwa.js" defer></script>

  <style>
    :root{
      --board-light-img: url("assets/board/wood_light.jpg");
      --board-dark-img:  url("assets/board/wood_dark.jpg");
    }
  </style>
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="js/ai-vs-ai.js"></script>

  <style>
    .dev-wrap{ padding:1rem; display:flex; flex-direction:column; gap:.9rem; max-width:520px; margin:0 auto; }
    .dev-banner{
      background:#fff3cd; color:#7a5b00; border:1px solid #f0d98c; border-radius:.7rem;
      padding:.6rem .8rem; font-weight:700; font-size:.85rem;
    }
    .dev-controls{ display:flex; gap:.6rem; flex-wrap:wrap; }
    .dev-field{ display:flex; flex-direction:column; gap:.25rem; font-weight:700; font-size:.82rem; flex:1; min-width:120px; }
    .dev-field select{ padding:.5rem; border-radius:.6rem; border:1px solid #d7dee8; font:inherit; }
    .dev-actions{ display:flex; gap:.6rem; }
    .dev-actions button{ flex:1; padding:.7rem; border-radius:.7rem; border:none; font-weight:800; cursor:pointer; }
    .dev-actions button:disabled{ opacity:.5; cursor:default; }
    #devStart{ background:var(--blue); color:#fff; }
    #devStop{ background:#fdeaea; color:#a3312f; }

    #devBoard.board{ width:min(90vw,420px); height:min(90vw,420px); margin:0 auto; }
    .dev-status{ text-align:center; font-weight:700; color:var(--blue); }

    .dev-log{
      background:var(--panel); border-radius:.8rem; box-shadow:var(--shadow);
      max-height:280px; overflow-y:auto; font-family:ui-monospace,Consolas,monospace; font-size:.78rem;
      padding:.6rem .7rem;
    }
    .dev-log .row{ padding:.15rem 0; border-bottom:1px dashed rgba(13,45,92,.08); white-space:nowrap; }
    .dev-log .row:last-child{ border-bottom:none; }

    .gate-card{
      background:var(--panel); border-radius:1rem; box-shadow:var(--shadow); padding:1.4rem 1rem;
      text-align:center; max-width:420px; margin:2rem auto;
    }
    .gate-card button{
      margin-top:.8rem; padding:.7rem 1.2rem; border:none; border-radius:.7rem;
      background:var(--blue); color:#fff; font-weight:800; cursor:pointer;
    }
  </style>
</head>
<body>
  <div class="shell">
    <!-- Developer-only tool: reached only via ?dev=1 or the hidden 5-tap
         affordance in Settings -> About. Never linked from the app's main
         navigation/menu. -->
    <div id="devGate" class="gate-card" hidden>
      <h3>Developer Mode Required</h3>
      <p>This AI-vs-AI test page is not part of normal navigation. Enable developer mode to continue.</p>
      <button id="btnEnableDev" type="button">Enable Developer Mode</button>
    </div>

    <main id="devMain" class="dev-wrap" hidden>
      <div class="dev-banner">🛠️ Developer tool — full games between two local AI instances, no human input.</div>

      <div class="dev-controls">
        <label class="dev-field">
          White level (1-10)
          <select id="levelWhite"></select>
        </label>
        <label class="dev-field">
          Black level (1-10)
          <select id="levelBlack"></select>
        </label>
      </div>

      <div class="dev-actions">
        <button id="devStart" type="button">Start Game</button>
        <button id="devStop" type="button" disabled>Stop</button>
      </div>

      <div class="dev-status" id="devStatus">Idle.</div>

      <div id="devBoard" class="board board-wood no-coords"></div>

      <div class="dev-log" id="devLog"></div>
    </main>
  </div>
</body>
</html>
